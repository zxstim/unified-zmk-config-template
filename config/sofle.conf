# Same hardware features the keyboard's original firmware had (read from its backup, 2026-09-26).

# OLED displays
CONFIG_ZMK_DISPLAY=y

# Rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow. By default, turning the underglow off also cuts external power, which turns the displays off.
CONFIG_ZMK_RGB_UNDERGLOW=y
