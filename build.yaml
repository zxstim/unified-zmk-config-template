# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#

# Firmware for a Sofle on nice!nano controllers (ZMK v0.3, matching what the keyboard shipped with).
# Each entry becomes one .uf2 file in the GitHub Actions build.
---
include:
  # Left half: runs the keymap and ZMK Studio (over USB). Studio's unlock step is off because the keymap has
  # no &studio_unlock key. It also fetches the right half's battery level and reports it to the Mac as a second
  # battery (for zmkaid); these settings only exist on the left half, so they're here rather than in sofle.conf.
  - board: nice_nano_v2
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
  - board: nice_nano_v2
    shield: sofle_right
  # Recovery only: flash to both halves to clear pairings and saved settings, then flash the normal firmware.
  - board: nice_nano_v2
    shield: settings_reset
